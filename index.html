<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Myntra Reverse Pricing</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
</head>

<body>

<header class="topbar">
  <div class="brand-wrap">
    <div class="logo-box">M</div>
    <div>
      <h1 class="app-title">Myntra Reverse Pricing</h1>
      <div class="sub-title">TP Based Smart Price Engine</div>
    </div>
  </div>

  <div class="top-actions">
    <button id="refreshBtn" class="btn btn-dark">
      Refresh Data
    </button>
  </div>
</header>

<section class="control-panel">

  <div class="control-item">
    <label>Profit Target</label>
    <select id="profitTarget"></select>
  </div>

  <div class="control-item">
    <label>Brand</label>
    <select id="brandFilter"></select>
  </div>

  <div class="control-item">
    <label>Pricing Mode</label>
    <select id="pricingMode">
      <option value="INT">Exact Price</option>
      <option value="9">Nearest 9</option>
    </select>
  </div>

  <!-- ✅ GENERATE PRICING BUTTON (PRESERVED) -->
  <div class="control-item">
    <label>&nbsp;</label>
    <button id="generatePricingBtn" class="btn btn-dark">
      Generate Pricing
    </button>
  </div>

</section>

<!-- TABS -->
<section class="tabs">
  <button class="tab active" data-tab="search">Search</button>
  <button class="tab" data-tab="master">Pricing Master</button>
  <button class="tab" data-tab="summary">Brand Summary</button>
  <button class="tab" data-tab="mrp">MRP Generator</button>
  <button class="tab" data-tab="calculator">Calculator</button>
</section>

<main class="page-wrap">

<!-- SEARCH -->
<section id="searchTab" class="tab-panel active">
  <div class="card">
    <input id="calcStyleId" placeholder="Enter Style ID or SKU">
    <button id="calcBtn">Search</button>
    <button id="clearCalcBtn">Clear</button>
    <div id="calcOutput">Search style and view pricing.</div>
  </div>
</section>

<!-- PRICING -->
<section id="masterTab" class="tab-panel">
  <div class="card">

    <div class="table-wrap">
      <table id="pricingTable">
        <thead id="pricingHead"></thead>
        <tbody id="pricingBody">
          <tr>
            <td class="center">Click Generate Pricing</td>
          </tr>
        </tbody>
      </table>
    </div>

    <button id="loadMoreBtn" class="btn full">
      Load More 50 Rows
    </button>

  </div>
</section>

<!-- SUMMARY -->
<section id="summaryTab" class="tab-panel">
  <div class="card">
    <table id="summaryTable">
      <tbody id="summaryBody">
        <tr>
          <td class="center">Run pricing first</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<!-- ✅ MRP GENERATOR -->
<section id="mrpTab" class="tab-panel">

  <div class="card">
    <div class="card-title">Upload CSV</div>

    <input type="file" id="mrpFile">

    <!-- PREVIEW TABLE -->
    <div class="table-wrap" style="margin-top:12px">
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Brand</th>
            <th>TP</th>
          </tr>
        </thead>
        <tbody id="mrpPreviewBody">
          <tr>
            <td colspan="3" class="center">
              Upload file to preview
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">

    <div class="grid-4">

      <div>
        <label>TP Margin</label>
        <select id="mrpTarget">
          <option value="5">5%</option>
          <option value="10">10%</option>
          <option value="15">15%</option>
        </select>
      </div>

      <div>
        <label>Discount</label>
        <select id="mrpDiscount">
          <option value="0.6">60%</option>
          <option value="0.65">65%</option>
          <option value="0.7">70%</option>
        </select>
      </div>

    </div>

    <button id="generateMrpBtn" class="btn btn-dark full">
      Generate MRP
    </button>

    <button id="downloadMrpBtn" class="btn full" disabled>
      Download CSV
    </button>

  </div>

</section>

<!-- CALCULATOR -->
<section id="calculatorTab" class="tab-panel">
  <div class="card">
    <button id="manualCalcBtn">Calculate</button>
    <div id="manualOutput"></div>
  </div>
</section>

</main>

<script type="module" src="js/main.js"></script>

</body>
</html>
