<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Myntra Reverse Pricing</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
</head>

<body>

<header class="topbar">
  <div class="brand-wrap">
    <div class="logo-box">M</div>
    <div>
      <h1 class="app-title">Myntra Reverse Pricing</h1>
      <div class="sub-title">TP Based Smart Price Engine</div>
    </div>
  </div>

  <button id="refreshBtn" class="btn btn-dark">Refresh Data</button>
</header>

<section class="control-panel">
  <select id="profitTarget"></select>
  <select id="brandFilter"></select>
  <select id="pricingMode">
    <option value="INT">Exact Price</option>
    <option value="9">Nearest 9</option>
  </select>
  <button id="exportBtn">Export CSV</button>
</section>

<section class="tabs">
  <button class="tab active" data-tab="search">Search</button>
  <button class="tab" data-tab="master">Pricing Master</button>
  <button class="tab" data-tab="summary">Brand Summary</button>
  <button class="tab" data-tab="mrp">MRP Generator</button>
  <button class="tab" data-tab="calculator">Calculator</button>
</section>

<main>

<!-- SEARCH -->
<section id="searchTab" class="tab-panel active">
  <input id="calcStyleId">
  <button id="calcBtn">Search</button>
  <button id="clearCalcBtn">Clear</button>
  <div id="calcOutput"></div>
</section>

<!-- PRICING -->
<section id="masterTab" class="tab-panel">
  <button id="generatePricingBtn">Generate Pricing</button>

  <table>
    <thead id="pricingHead"></thead>
    <tbody id="pricingBody">
      <tr><td>Click Generate Pricing</td></tr>
    </tbody>
  </table>

  <button id="loadMoreBtn">Load More</button>
</section>

<!-- SUMMARY -->
<section id="summaryTab" class="tab-panel">
  <table>
    <tbody id="summaryBody">
      <tr><td>Run pricing first</td></tr>
    </tbody>
  </table>
</section>

<!-- ✅ MRP GENERATOR -->
<section id="mrpTab" class="tab-panel">

  <h3>Upload CSV</h3>
  <input type="file" id="mrpFile">

  <!-- PREVIEW -->
  <div style="max-height:300px;overflow:auto;margin-top:10px">
    <table>
      <thead>
        <tr>
          <th>SKU</th>
          <th>Brand</th>
          <th>TP</th>
        </tr>
      </thead>
      <tbody id="mrpPreviewBody">
        <tr><td colspan="3">Upload file to preview</td></tr>
      </tbody>
    </table>
  </div>

  <button id="verifyBtn">✔ Verify Data</button>

  <h4>Controls</h4>

  <select id="mrpTarget">
    <option value="5">5%</option>
    <option value="10">10%</option>
    <option value="15">15%</option>
  </select>

  <select id="mrpDiscount">
    <option value="0.6">60%</option>
    <option value="0.65">65%</option>
    <option value="0.7">70%</option>
  </select>

  <button id="generateMrpBtn" disabled>Generate MRP</button>
  <button id="downloadMrpBtn" disabled>Download CSV</button>

</section>

<!-- CALCULATOR -->
<section id="calculatorTab" class="tab-panel">
  <button id="manualCalcBtn">Calculate</button>
  <div id="manualOutput"></div>
</section>

</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
