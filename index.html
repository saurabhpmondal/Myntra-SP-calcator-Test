<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Myntra Reverse Pricing</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
</head>

<body>

<header class="topbar">
  <div class="brand-wrap">
    <div class="logo-box">M</div>

    <div>
      <h1 class="app-title">MRP & Pricing Tool</h1>
      <div class="sub-title">Simple Price Engine</div>
    </div>
  </div>

  <div class="top-actions">
    <button id="refreshBtn" class="btn btn-dark hidden">Refresh Data</button>
  </div>
</header>

<section class="status-strip hidden">
  <div class="pill" id="loadStatus"></div>
  <div class="pill" id="recordStatus"></div>
  <div class="pill" id="timeStatus"></div>
</section>

<section class="control-panel hidden">
  <div class="control-item">
    <label>Profit Target</label>
    <select id="profitTarget"></select>
  </div>

  <div class="control-item">
    <label>Brand</label>
    <select id="brandFilter"></select>
  </div>

  <div class="control-item">
    <label>Pricing Mode</label>
    <select id="pricingMode"></select>
  </div>

  <div class="control-item">
    <button id="exportBtn" class="btn">Export CSV</button>
  </div>

  <div class="control-item">
    <button id="generatePricingBtn" class="btn btn-dark">
      Generate Pricing
    </button>
  </div>
</section>

<section class="tabs">
  <button class="tab active" data-tab="mrp">MRP Generator</button>
  <button class="tab" data-tab="calculator">Calculator</button>
</section>

<main class="page-wrap">

<section id="mrpTab" class="tab-panel active">

  <div class="card compact">
    
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Upload CSV</span>

      <a href="assets/sample-mrp.csv" download class="btn">
        Download Sample
      </a>
    </div>

    <div class="hint-text">
      Download sample → fill SKU, Brand, TP → upload file
    </div>

    <input type="file" id="mrpFile" class="file-input">

    <div class="table-wrap compact">
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Brand</th>
            <th>TP</th>
          </tr>
        </thead>
        <tbody id="mrpPreviewBody">
          <tr>
            <td colspan="3" class="center">
              Upload file to preview
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card compact">
    <div class="grid-3">

      <div>
        <label>TP Margin</label>
        <select id="mrpTarget">
          <option value="5">5%</option>
          <option value="10">10%</option>
          <option value="15">15%</option>
        </select>
      </div>

      <div>
        <label>Discount</label>
        <select id="mrpDiscount">
          <option value="0.6">60%</option>
          <option value="0.65">65%</option>
          <option value="0.7">70%</option>
        </select>
      </div>

      <div class="align-end">
        <button id="generateMrpBtn" class="btn btn-dark">
          Generate MRP
        </button>
      </div>

    </div>
  </div>

  <div class="card compact" id="mrpOutputCard" style="display:none">

    <div class="card-title">Generated MRP</div>

    <div class="table-wrap compact">
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Brand</th>
            <th>TP</th>
            <th>ISP</th> <!-- ADDED -->
            <th>MRP</th>
          </tr>
        </thead>
        <tbody id="mrpResultBody"></tbody>
      </table>
    </div>

    <div class="right" style="margin-top:10px">
      <button id="downloadMrpBtn" class="btn">
        Download CSV
      </button>
    </div>

  </div>

</section>

<section id="calculatorTab" class="tab-panel">
  <div class="card">
    <div class="card-title">Manual Calculator</div>

    <div class="grid-3">
      <select id="manualMode">
        <option value="tp">TP → SP</option>
        <option value="sp">SP → TP</option>
      </select>

      <select id="manualBrand"></select>

      <input id="manualInput" placeholder="Enter value">
    </div>

    <button id="manualCalcBtn" class="btn btn-dark full">
      Calculate
    </button>
  </div>

  <div class="card">
    <div class="card-title">Result</div>
    <div id="manualOutput" class="empty-box">
      Enter values and calculate.
    </div>
  </div>
</section>

</main>

<div id="toast" class="toast"></div>

<script type="module" src="js/app/main.js"></script>

</body>
</html>
