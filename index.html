<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Myntra Reverse Pricing</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
</head>

<body>

<header class="topbar">
  <div class="brand-wrap">
    <div class="logo-box">M</div>

    <div>
      <h1 class="app-title">Myntra Reverse Pricing</h1>
      <div class="sub-title">TP Based Smart Price Engine</div>
    </div>
  </div>

  <div class="top-actions">
    <button id="refreshBtn" class="btn btn-dark">Refresh Data</button>
  </div>
</header>

<!-- STATUS -->
<section class="status-strip">
  <div class="pill" id="loadStatus">Waiting...</div>
  <div class="pill" id="recordStatus">0 Styles</div>
  <div class="pill" id="timeStatus">--</div>
</section>

<!-- CONTROLS -->
<section class="control-panel">

  <div class="control-item">
    <label>Profit Target</label>
    <select id="profitTarget"></select>
  </div>

  <div class="control-item">
    <label>Brand</label>
    <select id="brandFilter"></select>
  </div>

  <div class="control-item">
    <label>Pricing Mode</label>
    <select id="pricingMode">
      <option value="INT">Exact Price</option>
      <option value="9">Nearest 9</option>
    </select>
  </div>

  <div class="control-item">
    <label>&nbsp;</label>
    <button id="exportBtn" class="btn">Export CSV</button>
  </div>

  <div class="control-item">
    <label>&nbsp;</label>
    <button id="generatePricingBtn" class="btn btn-dark">
      Generate Pricing
    </button>
  </div>

</section>

<!-- TABS -->
<section class="tabs">
  <button class="tab active" data-tab="search">Search</button>
  <button class="tab" data-tab="master">Pricing Master</button>
  <button class="tab" data-tab="summary">Brand Summary</button>
  <button class="tab" data-tab="mrp">MRP Generator</button>
  <button class="tab" data-tab="calculator">Calculator</button>
</section>

<main class="page-wrap">

<!-- SEARCH -->
<section id="searchTab" class="tab-panel active">
  <div class="card">
    <input id="calcStyleId" placeholder="Enter Style ID or ERP SKU">
    <button id="calcBtn">Search</button>
    <button id="clearCalcBtn">Clear</button>
    <div id="calcOutput">Search style and view pricing.</div>
  </div>
</section>

<!-- PRICING -->
<section id="masterTab" class="tab-panel">
  <div class="card">
    <div class="table-wrap">
      <table id="pricingTable">
        <thead id="pricingHead"></thead>
        <tbody id="pricingBody">
          <tr>
            <td class="center">Click Generate Pricing</td>
          </tr>
        </tbody>
      </table>
    </div>

    <button id="loadMoreBtn" class="btn full">
      Load More 50 Rows
    </button>
  </div>
</section>

<!-- SUMMARY -->
<section id="summaryTab" class="tab-panel">
  <div class="card">
    <table id="summaryTable">
      <tbody id="summaryBody">
        <tr>
          <td class="center">Run pricing first</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<!-- MRP GENERATOR -->
<section id="mrpTab" class="tab-panel">

  <div class="card">
    <div class="card-title">Upload CSV</div>

    <input type="file" id="mrpFile">

    <div class="table-wrap" style="margin-top:12px">
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Brand</th>
            <th>TP</th>
          </tr>
        </thead>
        <tbody id="mrpPreviewBody">
          <tr>
            <td colspan="3" class="center">Upload file to preview</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">

    <div class="grid-4">
      <div>
        <label>TP Margin</label>
        <select id="mrpTarget">
          <option value="5">5%</option>
          <option value="10">10%</option>
          <option value="15">15%</option>
        </select>
      </div>

      <div>
        <label>Discount</label>
        <select id="mrpDiscount">
          <option value="0.6">60%</option>
          <option value="0.65">65%</option>
          <option value="0.7">70%</option>
        </select>
      </div>
    </div>

    <button id="generateMrpBtn" class="btn btn-dark full">
      Generate MRP
    </button>

    <button id="downloadMrpBtn" class="btn full" disabled>
      Download CSV
    </button>

  </div>

</section>

<!-- ✅ FULLY RESTORED CALCULATOR -->
<section id="calculatorTab" class="tab-panel">

  <div class="card">
    <div class="card-title">Manual Calculator</div>

    <div class="grid-4">

      <div>
        <label>Mode</label>
        <select id="manualMode">
          <option value="tp">TP → Calculate SP</option>
          <option value="sp">SP → Check TP</option>
        </select>
      </div>

      <div>
        <label>Brand</label>
        <select id="manualBrand">
          <option value="">Select Brand</option>
        </select>
      </div>

      <div>
        <label>Article</label>
        <select id="manualArticle">
          <option value="Saree">Saree</option>
        </select>
      </div>

      <div>
        <label id="manualInputLabel">TP Value</label>
        <input type="number" id="manualInput" placeholder="Enter value">
      </div>

    </div>

    <div style="margin-top:12px">
      <button id="manualCalcBtn" class="btn btn-dark full">
        Calculate
      </button>
    </div>

  </div>

  <div class="card">
    <div class="card-title">Calculator Result</div>

    <div id="manualOutput" class="empty-box">
      Select mode and calculate.
    </div>
  </div>

</section>

</main>

<div id="toast" class="toast"></div>

<script type="module" src="js/app/main.js"></script>

</body>
</html>
